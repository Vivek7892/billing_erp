services:
  # ============================================================
  # BACKEND DJANGO REST API (Web Service)
  # ============================================================
  - type: web
    name: billing-system-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python start.py
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: billing-system-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: app.dreamwithtech.dev,share.dreamwithtech.dev,api.dreamwithtech.dev,.dreamwithtech.dev,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.dreamwithtech.dev,https://share.dreamwithtech.dev
      - key: CSRF_TRUSTED_ORIGINS
        value: https://app.dreamwithtech.dev,https://share.dreamwithtech.dev
      - key: FRONTEND_URL
        value: https://app.dreamwithtech.dev
      - key: PUBLIC_SHARE_URL
        value: https://share.dreamwithtech.dev
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: EMAIL_PROVIDER
        value: auto
      - key: DEFAULT_FROM_EMAIL
        value: "Dreamwithtech Billing ERP <dreamwithtech.dev@gmail.com>"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SHOP_LOGO_BUCKET
        value: billing_shop_logo

  # ============================================================
  # FRONTEND REACT APPLICATION (Static Site)
  # ============================================================
  - type: static
    name: billing-system-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    domains:
      - app.dreamwithtech.dev
      - share.dreamwithtech.dev
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://billing-system-api.onrender.com/api
      - key: VITE_PUBLIC_SHARE_URL
        value: https://share.dreamwithtech.dev

# ============================================================
# MANAGED POSTGRESQL DATABASE
# ============================================================
databases:
  - name: billing-system-db
    plan: free
    databaseName: billing_db
    user: billing_user
